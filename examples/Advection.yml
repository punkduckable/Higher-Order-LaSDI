trainer:
  type:                     "First_Order_Rollout"

  max_iter:                 4000
  n_iter:                   2000
  max_greedy_iter:          4000

  # If true, compute a single global mean/std from TRAINING data only, and normalize
  # all training/testing trajectories using these values.
  normalize:                true
  
  device:                   'cuda:0'

  noise_ratio:              0.0

  First_Order_Rollout:
    lr:                     0.001
    gradient_clip:          25.0      # Maximum allowable gradient magnitude; will rescale gradients if exceeded.

    # p_rollout grows from p_rollout_init by dp_per_update every rollout_update_freq epochs, capped at max_p_rollout.
    p_rollout_init:         0.01
    rollout_update_freq:    20
    dp_per_update:          0.01
    max_p_rollout:          0.75      # Maximum proportion of the time window used for rollout loss.
    n_rollouts:             4         # Number of rollable start frames to rollout per training parameter per epoch.

    p_IC_rollout_init:      0.01
    IC_rollout_update_freq: 10
    IC_dp_per_update:       0.01
    max_p_IC_rollout:       1.0       # Maximum proportion of the time window used for IC rollout loss.

    warmup_epochs:          80        # Number of epochs to warmup the learning rate after greedy sampling; checkpointing is disabled during warmup.

    loss_weights:
      recon:                1.0
      rollout:              0.0
      IC_rollout:           0.25

    loss_types:
      recon:                "MSE"
      rollout:              "MSE"
      IC_rollout:           "MSE"

workflow:
  use_restart:              False
  restart_file:            

sampler:
  type:                     'ROM_Discrepancy'

parameter_space:
  parameters:
    - name:                 w
      min:                  0.9
      max:                  1.1
      test_space_type:      uniform
      sample_size:          11
      log_scale:            false
    - name:                 g
      min:                  1.55
      max:                  1.60
      test_space_type:      uniform
      sample_size:          11
      log_scale:            false
  test_space:
    type:                   grid

EncoderDecoder:
  type:                     autoencoder
  trainable:                true
  autoencoder:
    n_Decoders:             1
    hidden_widths:          [250, 100, 100, 100]
    latent_dimension:       10  
    activations:            ["sin", "sin", "sin", "sin"]

latent_dynamics:
  type:                     cable
  trainable:                true
  loss_weights: 
    LD:                     1.0
    diversity:              0.0005
    coef:                   0.0001
    tail:                   0.1
  cable: 
    n_experts:              16
    n_active:               4
    hidden_widths:          [64, 64]
    activations:            ['tanh', 'tanh']
    use_biases:             true 
    coef_norm:              'l2'
    use_mask:               true
    eps_engaged:            0.001
    mask_threshold:         0.0005
    first_mask_step:        1000
    mask_update_freq:       250

physics:
  type:                     Advection
  Advection:
    n_t:                    501
    t_max:                  5.0
    uniform_t_grid:         true
