trainer:
  type:                     "First_Order_Rollout"

  max_iter:                 4000
  n_iter:                   2000
  max_greedy_iter:          4000
  
  # If true, compute a single global mean/std from TRAINING data only, and normalize
  # all training/testing trajectories using these values.
  normalize:                true

  device:                   'cuda:0'

  noise_ratio:              0.0

  First_Order_Rollout:
    lr:                     0.001
    gradient_clip:          25.0     # Long ODE rollouts produce legitimate gradients of 100-130; clipping at 25 discards 80% of the signal.

    # p_rollout grows from p_rollout_init by dp_per_update every rollout_update_freq epochs, capped at max_p_rollout.
    p_rollout_init:         0.01
    rollout_update_freq:    10
    dp_per_update:          0.005
    max_p_rollout:          0.5 
    n_rollouts:             4         # Number of rollable start frames to rollout per training parameter per epoch.

    p_IC_rollout_init:      0.01
    IC_rollout_update_freq: 10
    IC_dp_per_update:       0.005
    max_p_IC_rollout:       1.0  

    warmup_epochs:          80      # number of epochs to warmup the learning rate after greedy sampling; checkpointing is disabled during warmpup.

    loss_weights:
      recon:                1.0
      rollout:              0.0
      IC_rollout:           0.25

    loss_types:
      recon:                "MSE"
      rollout:              "MSE"
      IC_rollout:           "MSE"
  
workflow:
  use_restart:              False
  restart_file:             

sampler:
  type:                     'ROM_Discrepancy'
    
parameter_space:
  parameters:
    - name:                 A
      test_space_type:      list
      list:                 [0.9, 0.92, 0.94, 0.96, 0.98, 1.0, 1.02, 1.04, 1.06, 1.08, 1.1]
    - name:                 w
      test_space_type:      uniform
      min:                  0.23
      max:                  0.27
      sample_size:          11
      log_scale:            false
  test_space:
    type:                   grid

EncoderDecoder:
  type:                     ae
  trainable:                true
  ae:
    n_Decoders:             1
    hidden_widths:          [250, 100, 100, 100]
    activations:            ["sin", "sin", "sin", "sin"]
    latent_dimension:       10

latent_dynamics:
  type:                     cable
  trainable:                true
  loss_weights: 
    LD:                     1.0
    diversity:              0.001
    coef:                   0.0001
    tail:                   0.05
  cable: 
    n_experts:              16
    n_active:               4
    hidden_widths:          [64, 64]
    activations:            ['tanh', 'tanh']
    use_biases:             true 
    coef_norm:              'l2'
    eps_engaged:            0.001
    use_mask:               true
    mask_threshold:         0.001
    first_mask_step:        1000
    mask_update_freq:       100

physics:
  type:                     Explicit
  
  Explicit:
    n_t:                    501
    t_max:                  6
    n_positions:            1000
    x_min:                  -2.5
    x_max:                  2.5
    y_min:                  -2.5
    y_max:                  2.5
    uniform_t_grid:         True
  
